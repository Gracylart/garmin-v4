<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emote · 参数化指针转场</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#111416;color:#ebeff0}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:28px 22px 48px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.17em;color:#84b5c5}h1{font-size:clamp(25px,4vw,34px);font-weight:550;line-height:1.3;margin:10px 0}p{color:#9eaaaf;margin:0 0 22px}.stage{padding:14px 0 18px}.stage canvas{display:block;width:min(100%,390px);height:auto;aspect-ratio:1;margin:auto;background:#000;border-radius:50%;box-shadow:0 0 0 1px #3b484e,0 0 0 7px #191f23}.bar,.presets,.options{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.bar{margin-top:18px}.bar label{display:flex;align-items:center;gap:9px}button,input{font:inherit}button,input[type=time]{min-height:44px;background:#1d2428;color:#ebeff0;border:1px solid #3f4e56;border-radius:8px;padding:8px 12px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#29343b}button:focus-visible,input:focus-visible{outline:2px solid #a6dae9;outline-offset:3px}.primary{background:#c7e3eb;color:#11252e;border-color:#c7e3eb;font-weight:600}.primary:hover{background:#e2f5fa}.presets{margin-top:10px;gap:8px}.presets button{color:#aebdc4;font:13px ui-monospace,monospace;min-height:36px;padding:6px 10px}.timeline{display:grid;grid-template-columns:auto 1fr 65px;gap:12px;align-items:center;margin:14px 0}input[type=range]{accent-color:#acd5e2;width:100%;min-width:0;min-height:36px;cursor:pointer}output{font:13px ui-monospace,monospace;color:#b9d1d9;text-align:right}.options{font-size:13px;color:#aebbc1;gap:8px 18px}.options label{display:flex;align-items:center;gap:7px;min-height:36px}input[type=checkbox]{accent-color:#b2dbea;width:16px;height:16px}.controls{margin-top:24px;padding-top:20px;border-top:1px solid #2f3a40}.controls-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.controls-head h2{font-size:16px;font-weight:500;margin:0}.controls-head button{font-size:12px;min-height:36px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}.param label{display:flex;justify-content:space-between;align-items:center}.param small{display:block;font-size:12px;color:#8f9fa7}.note{font-size:12px;margin:22px 0 0;color:#8f9fa7}@media(max-width:500px){main{padding:22px 18px 38px}.grid{grid-template-columns:1fr;gap:12px}.stage{padding-top:8px}.bar{gap:8px}.timeline{gap:8px;grid-template-columns:auto 1fr 60px}.presets button{min-height:40px}}
</style></head><body><main>
<div class="eyebrow">EMOTE / MOTION STUDY 02</div>
<h1>一秒，指针成为眼睛</h1>
<p>就近落位，轻柔回弹。快速归位，柔和睁眼。</p>
<section class="stage" aria-label="454 像素圆屏动效预览"><canvas id="watch" width="454" height="454" role="img" aria-label="两根圆头指针沿短弧移动、转平、缩短并睁眼"></canvas></section>
<div class="bar"><label for="clock-time">起始时间<input id="clock-time" type="time" value="06:30" required></label><button id="play" class="primary" type="button">重播 1 秒</button><button id="pause" type="button">暂停</button></div>
<div class="presets" aria-label="快速切换起始时间"><button type="button" data-clock="06:30">06:30</button><button type="button" data-clock="10:10">10:10</button><button type="button" data-clock="12:00">12:00</button><button type="button" data-clock="03:15">03:15</button></div>
<div class="timeline"><label for="scrub">时间轴</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><output id="readout" for="scrub">0.00 s</output></div>
<div class="options"><label><input id="debug" type="checkbox">红：时针 / 蓝：分针</label><label><input id="guides" type="checkbox">显示中心运动轨迹</label></div>
<p class="note" id="route-note" aria-live="polite"></p>
<section class="controls" aria-label="动效参数"><div class="controls-head"><h2>微调动效</h2><button id="reset" type="button">恢复推荐值</button></div><div class="grid">
<div class="param"><label for="arc">路径弧度<output id="arc-value" for="arc">12%</output></label><input id="arc" type="range" min="0" max="24" step="1" value="12"><small>0 为直线；越大，滑行弧度越明显。</small></div>
<div class="param"><label for="turn">转向延后<output id="turn-value" for="turn">15%</output></label><input id="turn" type="range" min="0" max="60" step="1" value="15"><small>越大，保留原指向的时间越长。</small></div>
<div class="param"><label for="shrink">收缩延后<output id="shrink-value" for="shrink">30%</output></label><input id="shrink" type="range" min="0" max="60" step="1" value="30"><small>越大，指针越晚收成闭眼横线。</small></div>
<div class="param"><label for="stagger">双针错拍<output id="stagger-value" for="stagger">30 ms</output></label><input id="stagger" type="range" min="0" max="60" step="5" value="30"><small>分针稍晚出发，两针仍同时到位。</small></div>
<div class="param"><label for="tempo">节奏偏前<output id="tempo-value" for="tempo">35%</output></label><input id="tempo" type="range" min="0" max="70" step="5" value="35"><small>越大，越早完成主要位移，留更多时间减速。</small></div>
<div class="param"><label for="elastic">微弹性<output id="elastic-value" for="elastic">50%</output></label><input id="elastic" type="range" min="0" max="100" step="5" value="50"><small>快速衰减的轻微形变；设为 0 可对比关闭效果。</small></div>
</div></section>
<p class="note">两针按起始左右就近落位，避免交叉交换。含睁眼共 1 秒；调整参数后自动重播。开启“减少动态效果”时，可手动重播或拖动时间轴。</p>
</main><script src="clock-transition.js"></script><script src="orbit-preview.js"></script></body></html>
