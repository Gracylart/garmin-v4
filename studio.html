<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOUB · 动效工作台</title><link rel="stylesheet" href="studio.css?v=screen-only-20261026"></head>
<body>
<main class="shell" data-page="appearance">
 <nav class="rail" aria-label="工作台页面">
  <button data-page="appearance" title="外观" aria-label="外观"><img width="18" height="18" alt=""></button>
  <button data-page="animation" title="动画" aria-label="动画"><img width="18" height="18" alt=""></button>
 </nav>
 <section class="workspace" aria-label="实时预览">
  <div class="stage" data-preview="screen">
   <canvas id="face" width="454" height="454" tabindex="0" aria-label="互动眼睛预览，点击变换表情，横跨拖动转圈，连点三次生气"></canvas><p class="stage-note" data-i18n="resolution">VENU 4 · 45 mm · 454 × 454</p></div>
  <div class="export-row"><button class="primary" id="export-png"><img src="studio-assets/appearance-imgIconDownload.svg" width="18" height="18" alt=""><span data-i18n="png">导出 PNG</span></button><button class="export-more primary" id="export-config" aria-label="导出外观配置" title="导出外观配置 JSON"><img src="studio-assets/appearance-imgIconChevron.svg" width="16" height="16" alt=""></button></div>
  <p class="hint" data-i18n="hint">点击换表情 · 连点三次生气 · 横跨拖动转圈</p>
 </section>
 <aside class="inspector">
  <section class="appearance-only"><h2 data-i18n="shape">眼形</h2><div class="tiles" id="shapes"></div><h2 data-i18n="expression">运动项目</h2><div class="tiles sport-tiles" id="expressions"></div><div id="sport-transport" class="sport-transport" hidden><button id="sport-replay" aria-label="重播运动">↺</button><button id="sport-play" aria-label="暂停运动">Ⅱ</button><label><span data-i18n="sportSpeed">运动速度</span><select id="sport-speed" aria-label="运动播放速度"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><span data-i18n="sportFps">帧率</span><select id="sport-fps" aria-label="运动预览帧率"><option value="30">30 fps</option><option value="15">15 fps</option></select></label><output id="sport-phase" aria-live="off"></output></div><h2 data-i18n="color">颜色</h2><div class="swatches" id="colors"></div></section>
  <section class="animation-only"><h2 data-i18n="animation">动画</h2><div class="tiles" id="animations"></div><label class="time-setting"><span data-i18n="time">指针起始时间</span><input id="studio-time" type="time" value="10:10"></label><p class="muted" data-i18n="simulation">浏览器预览；震动与传感器事件为模拟，不代表真机性能。</p></section>
 </aside>
 <section class="timeline animation-only" aria-label="动画时间轴">
  <div class="transport"><output id="elapsed">0.00 s</output><button id="toggle-play" aria-label="暂停"><img src="studio-assets/animation-imgIconPause.svg" width="20" height="20" alt=""></button><output id="total">0.00 s</output></div>
  <div class="timeline-heading"><select id="sequence" aria-label="播放序列"><option value="random" data-i18n="sequence">随机播放</option><option value="single" data-i18n="single">单个动画</option></select><button id="export-sequence"><img src="studio-assets/animation-imgIconDownload.svg" width="18" height="18" alt=""><span data-i18n="exportSequence">导出序列 JSON</span></button></div>
  <div class="track-scroll"><div class="track"><div id="ruler"></div><div id="clips"></div><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="动画进度"><div id="playhead"></div></div></div>
  <div class="timeline-footer"><span data-i18n="scrubHint">拖动时间轴检查每一刻</span><label><span data-i18n="zoom">缩放</span><input id="zoom" type="range" min="100" max="200" step="25" value="100" aria-label="时间轴缩放"><output id="zoom-value">100%</output></label><button id="loop" aria-pressed="true" data-i18n="loop">循环</button></div>
 </section>
 <p id="notice" role="status" aria-live="polite"></p>
</main>
<div hidden><span id="status"></span><button id="wake"></button><button id="clock"></button><button id="steps"></button><button id="workout"></button><button id="move"></button><input id="clock-time" type="time"></div>
<script>globalThis.EMOTE_STUDIO=true;</script><script src="play-preview.js?v=sports18-center-1"></script><script src="clock-transition.js"></script><script src="sports-catalog.js?v=sports18-center-1"></script><script src="sports-exact.js?v=sports18-center-1"></script><script src="sports-bounce.js?v=sports18-center-1"></script><script src="sports-transitions.js?v=sports18-center-1"></script><script src="sport-icons.js?v=sports18-center-1"></script><script src="studio.js?v=screen-only-20261026"></script>
</body></html>
